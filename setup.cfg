[flake8]
max-line-length = 160
# E203: slice spacing; E741: math names (I, l); E731: small lambdas; E402: imports after sys.path setup
extend-ignore = E203,E741,E731,E402
extend-exclude = .venv

[mypy]
ignore_missing_imports = True
# monkeypatching library methods is intentional; ultralytics result fields are Optional but always set here
disable_error_code = method-assign,union-attr
exclude = \.venv
